name: Nightly e2e

# The end-to-end suite, every night.
#
# Every user-facing bug this project has shipped was found by loading the page
# and looking; the suite encodes that class of bug, and until now it ran only
# when somebody remembered to run it.
#
# Three kinds of job, so that a night asks little of production:
#
#   suite       the Node suite, with no database and no secret
#   whole       every spec, on a copy of this commit: a local stack and its own
#               build, on the runner, with no secret and production out of reach
#   production  a short walk of the real thing, the speed budgets and the doors,
#               the one job that holds production's key
#
# Why apart: the whole suite on production was about 125,000 reads a night, and
# production's database rebooted during it on 1, 4 and 6 Nov 2026; the Node suite
# wrote and deleted there with the service key; and a checkout at one commit was
# testing whatever had deployed since. On its own stack 98.2% of what passed on
# production passed unchanged, in 44 minutes, and the Node suite held its coverage
# with no database, since nightly-database.yml runs the suites that need one on a
# stack of their own (the trial of 6 Nov, run 42282387310).
#
# The hour it asks for is not the hour it gets: GitHub starts a schedule here 3.4
# to 10.3 hours late, whichever hour it asks for (every daily workflow's last 25
# runs, read 6 Nov 2026). Asked for at 09:00, it started between 15:11 and 19:18
# UTC, in the working day. Asked for at 23:17, it starts between about 02:40 and
# 09:35 UTC, the small hours in New York, and before the Sunday weeklies.
#
# ci.yml's rule — no live service secrets in CI — still holds for pull requests;
# whether this ONE job may hold them is the owner's decision, made by adding the
# secrets in the repository settings, and until then the job is honest about what
# it covered: the signed-in specs skip, with a stated reason, when they are absent.
#
# A dispatch by hand may ask for the credential-free half alone, and point it
# at another address (one that needs no bypass): no secret is read, nothing is written, and
# no issue is filed or closed for a run that covered only part of the suite.
on:
  schedule:
    - cron: "17 23 * * *"
  workflow_dispatch:
    inputs:
      credential_free_only:
        description: "Only the specs that need no credentials: no secret read, nothing written, no issue filed"
        type: boolean
        default: false
      specs:
        description: "Only these specs, on the whole suite's copy, for a look at a few reds in minutes: e2e/leads.spec.ts e2e/shell/phone.spec.ts. No node suite, no check of production, no issue filed."
        type: string
        default: ""
      base_url:
        description: "Where the credential-free specs run, an address that needs no bypass (a preview with protection off; preview-smoke.yml takes the protected ones); production when empty. Read by that half alone: the whole suite runs on its own copy, and the check of production is of production."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # The Node suite, with no database: its database and integration suites skip here and run on their own stack every
  # night (nightly-database.yml, `pnpm test:db`, in the two passes they need). Its own jobs with their own cap, ahead of
  # the specs: in one 60-minute job its 31 minutes left the specs too little, and from 1 Oct 2026 every run ended
  # cancelled with the specs unfinished.
  #
  # Four parts at once, each a quarter of the files (Node's --test-shard), as CI's are: in one runner the suite outgrew
  # its 45 minutes, and from 14 Oct 2026 every night was cancelled with a quarter of it unrun, the failures in that
  # quarter seen by nobody. Each part keeps its coverage report, and the coverage job below judges the four together.
  suite:
    name: Node suite (${{ matrix.part }}/4)
    if: ${{ !inputs.credential_free_only && !inputs.specs }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # A part that fails does not stop the others: the night should say every test that failed.
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test -- --test-shard=${{ matrix.part }}/4
        env:
          # Where this part's coverage report is kept, for the coverage job (tooling/scripts/checks/test.mjs).
          TEST_LCOV: coverage-part.lcov
      # The report names the code it ran, not a workspace's data; a day is enough for the job below.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-part-${{ matrix.part }}
          path: coverage-part.lcov
          retention-days: 1
          if-no-files-found: error

  # What the suite ran of the code, judged against the floors once the four parts are in: the one run that measures
  # the whole suite (tooling/scripts/checks/coverage.mjs). A part that failed is the suite's red already, and a
  # measure of a run that did not pass is no measure, so it runs only when every part passed.
  coverage:
    name: What the suite ran of the code
    needs: suite
    if: ${{ needs.suite.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v7
        with:
          pattern: coverage-part-*
          path: parts
      - run: node tooling/scripts/checks/coverage.mjs parts/coverage-part-1/coverage-part.lcov parts/coverage-part-2/coverage-part.lcov parts/coverage-part-3/coverage-part.lcov parts/coverage-part-4/coverage-part.lcov

  # Every spec, on a copy of this commit: a local stack and its own build, on this runner. It holds no secret: its keys are
  # the local stack's published demo keys, and a stand-in the stub never reads. The specs and the app are one commit, so
  # a deploy cannot land under a run. After the suite, whatever it said: a red suite is no reason to leave the pages
  # unlooked at.
  whole:
    name: The whole suite on its own stack
    needs: suite
    if: ${{ !cancelled() && !inputs.credential_free_only }}
    runs-on: ubuntu-latest
    # 44 minutes with its setup on 6 Nov 2026, with its reds' tries on top.
    timeout-minutes: 60
    # Who the signed-in specs are, and who else is on their team: addresses at
    # example.com, which receive no mail. e2e-workspace.mjs makes both users
    # and their workspace; session.ts signs in as the first.
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      # Says this run is meant to be signed in, so skipping the signed-in
      # half is a failure rather than a quiet success. Not keyed on CI:
      # GitHub sets that for the pull-request job too, which is meant to
      # run credential-free.
      REQUIRE_SERVICE_CREDENTIALS: "1"
      E2E_USER_EMAIL: e2e-owner@example.com
      E2E_MEMBER_EMAIL: e2e-member@example.com
      # localhost by name: Next says a request's host as localhost whatever it was asked by (NextURL), so asked as
      # 127.0.0.1 the proxy's rewrite of an address that names nothing reads as another host and comes back to the
      # proxy, which sends it to sign in: the opt-in page's 404 answered 307.
      E2E_BASE_URL: http://localhost:3100
      # Unset, the app calls production's edge (apps/dashboard/src/server/edge.ts). The trial called one path of it.
      EDGE_URL: http://127.0.0.1:3101
      # Without a credential the app never calls the edge at all (edgeConfigured), and the stand-in reads none.
      EDGE_CALL_SECRET: a-stand-in-the-stub-never-reads
      # What /api/version answers, which is how the step below knows the app is this commit.
      VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
      # Every request says what it touched, for the refresh map's derivation (decision 0058 stage C, the page-open
      # PRD's P4): the suite runs every write path in its own workspace, which a week of production's sample does not.
      # The app's log below keeps those lines.
      E2E_TOUCHES_ALL: "1"
      # E2E_PAID_MODEL is not set: the Ask tests that run a real model turn
      # skip and say so, and what a page would ask by itself (a turn, Today's
      # morning, the Line's warm) stops at the sign-in (e2e/session.ts).
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@v3
        with:
          version: 2.116.0
      - run: pnpm install --frozen-lockfile
      # So a mistake fails here instead of reaching what customers use, and the edge's logs are not this project's to read.
      - name: Production cannot be reached from this machine
        run: echo "127.0.0.1 app.chanlytics.com chanlytics-messaging.vercel.app" | sudo tee -a /etc/hosts
      # A file's picture is drawn through Storage's image route, as production's is: off in config.toml, for the stacks
      # that do not start imgproxy.
      - name: Pictures, as production draws them
        run: sed -i '/^# \[storage.image_transformation\]/,+1 s/^# //' supabase/config.toml
      # ghcr.io answers a burst of image pulls with "toomanyrequests" (database.yml says more): a failed start keeps what
      # it pulled, so a few more attempts, spaced out, finish the set.
      - name: Start the stack
        run: |
          for attempt in 1 2 3 4 5 6; do
            if supabase start -x studio,inbucket,edge-runtime,logflare,vector; then exit 0; fi
            echo "supabase start failed on attempt $attempt; pulling the rest after a pause" >&2
            supabase stop --no-backup || true
            sleep $((attempt * 15))
          done
          exit 1
      - name: Point everything at the stack
        run: |
          service="$(supabase status -o env | sed -n 's/^SERVICE_ROLE_KEY="\(.*\)"$/\1/p')"
          anon="$(supabase status -o env | sed -n 's/^ANON_KEY="\(.*\)"$/\1/p')"
          {
            echo "SUPABASE_URL=http://127.0.0.1:54321"
            echo "SUPABASE_SERVICE_ROLE_KEY=$service"
            echo "SUPABASE_ANON_KEY=$anon"
            echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$anon"
          } >> "$GITHUB_ENV"
      - name: Build this commit
        run: pnpm --filter @chanlytics/dashboard build
      - name: Start the edge's stand-in and the app
        run: |
          nohup node tooling/scripts/e2e-harness/edge-stub.mjs 3101 > edge-stub.log 2>&1 &
          nohup pnpm --filter @chanlytics/dashboard exec next start -p 3100 > next-start.log 2>&1 &
      - name: The app answers, at this commit
        run: |
          for i in $(seq 1 60); do
            said="$(curl -fsS http://localhost:3100/api/version || true)"
            case "$said" in *"$GITHUB_SHA"*) echo "$said"; exit 0 ;; esac
            sleep 2
          done
          cat next-start.log
          exit 1
      # The run's own workspace, before any spec signs in: a test owner with exactly one membership, fake people, one
      # conversation, one call and a WhatsApp channel with no credentials.
      - name: The run's own workspace, in its known state
        run: node --import tsx tooling/scripts/ops/e2e-workspace.mjs --apply
      - run: pnpm e2e:install
      # One retry: a copy on this machine has no network to forgive, and a retry that passes hides a flake.
      - name: Every spec
        run: pnpm exec playwright test --retries=1 $SPECS
        env:
          SPECS: ${{ inputs.specs }}
      - name: What reached for the edge, by path
        if: ${{ !cancelled() }}
        run: sed -E 's/\?.*$//' edge-stub.log | sort | uniq -c | sort -rn | head -40
      # Everything here is the stack's made-up data.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: whole-suite
          path: |
            playwright-report
            next-start.log
            edge-stub.log
          retention-days: 7
          if-no-files-found: warn

  # The real thing, briefly: a walk of the pages, the speed budgets, and the doors only production can answer. After the
  # whole suite, whatever it said: a red there is no reason to leave production unlooked at. A dispatch for the
  # credential-free half skips both suites, and this still runs. It holds production's key, and no other job does.
  production:
    name: The check of production
    needs: whole
    if: ${{ !cancelled() && !inputs.specs }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Ask's weekly and Leads' weekly write this workspace too, and e2e-workspace.mjs rewrites it, so the three take turns.
    concurrency:
      group: nightly-e2e
      cancel-in-progress: false
    env:
      E2E_USER_EMAIL: e2e-owner@example.com
      E2E_MEMBER_EMAIL: e2e-member@example.com
      # "true" for a dispatch that asked for the credential-free half alone; "false" on the schedule.
      CREDENTIAL_FREE: ${{ inputs.credential_free_only && 'true' || 'false' }}
    # issues: write is the whole point of the steps that say what happened -- a
    # red run in the night that nobody is told about is the failure this suite
    # exists to prevent, one level up.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Ask's last 24 hours against the nightly's lines (the Ask Rewired Phase 6
      # plan, D4): a median cache hit under 50% or a median first text over 6 s
      # is a silent invalidator or a slow model, caught the day it lands. Read
      # only; the service key because a day's turns are every workspace's. Its
      # verdict is the output's last line. It exits 1 when Ask crossed a line and
      # 2 when the day could not be read at all (a variable missing, a read
      # refused): two different issues, never the suite's red (the scorecard's
      # I2:2).
      - name: Ask's cache and first words hold their lines
        id: ask_day
        if: ${{ !cancelled() && env.CREDENTIAL_FREE != 'true' }}
        shell: bash
        run: |
          set +e
          node --import tsx tooling/scripts/ops/ask-day.mjs --check > ask-day.txt 2>&1
          code=$?
          cat ask-day.txt
          tail -n 1 ask-day.txt > ask-day-verdict.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
        env:
          SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SERVICE_ROLE_KEY }}
      - name: Say what Ask's day came to
        if: ${{ steps.ask_day.outcome == 'success' }}
        shell: bash
        run: |
          crossed=(--title "Ask's day crossed a line" --match "Ask's day crossed a line" --match "Ask's cache or first words crossed a line")
          unread=(--title "Ask's day could not be checked" --match "Ask's day could not be checked")
          case "$CODE" in
            0)
              node tooling/scripts/ops/rolling-issue.mjs --state green "${crossed[@]}"
              node tooling/scripts/ops/rolling-issue.mjs --state green "${unread[@]}"
              ;;
            1)
              node tooling/scripts/ops/rolling-issue.mjs --state red "${crossed[@]}" --body-file ask-day-verdict.txt
              node tooling/scripts/ops/rolling-issue.mjs --state green "${unread[@]}"
              ;;
            *)
              node tooling/scripts/ops/rolling-issue.mjs --state red "${unread[@]}" --body-file ask-day-verdict.txt
              ;;
          esac
        env:
          CODE: ${{ steps.ask_day.outputs.code }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm e2e:install
      # The run's own workspace, made or put back in its known state before any
      # spec signs in. The signed-in specs used to run as the owner's account in
      # a live customer's workspace, writing to it and spending Ask tokens there.
      # Now a test owner with exactly one membership signs in to fake people,
      # one conversation, one call and a WhatsApp channel with no credentials:
      # nothing in it can reach a customer or a provider, and the one address
      # its alerts go to is Resend's test inbox, which delivers nowhere.
      - name: The run's own workspace, in its known state
        if: ${{ !cancelled() && env.CREDENTIAL_FREE != 'true' }}
        run: node --import tsx tooling/scripts/ops/e2e-workspace.mjs --apply
        env:
          SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SERVICE_ROLE_KEY }}
      - name: The walk, the budgets and the doors
        if: ${{ !cancelled() && env.CREDENTIAL_FREE != 'true' }}
        run: pnpm e2e e2e/production e2e/coverage.spec.ts e2e/auth/auth-gate.spec.ts e2e/auth/signup.spec.ts e2e/shell/csp.spec.ts
        env:
          CI: "true"
          E2E_PRODUCTION: "1"
          REQUIRE_SERVICE_CREDENTIALS: "1"
          E2E_BASE_URL: https://app.chanlytics.com
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SERVICE_ROLE_KEY }}
          # The one path that creates a user (signup.spec.ts sends a real code
          # and cleans up after itself) runs nightly, not on every pull request.
          E2E_SIGNUP_PROBE: "1"
          # Where that code goes: a real inbox, with {stamp} where each run's
          # fresh address differs (you+e2e-{stamp}@your-domain). Unset, the probe
          # skips and says why, since no example.com address can receive the code.
          # Adding the secret is the owner's call.
          E2E_SIGNUP_EMAIL: ${{ secrets.E2E_SIGNUP_EMAIL }}
      # The credential-free half alone, by hand: no key of any kind in the
      # environment, so every signed-in spec skips and says why, and nothing
      # the run touches can write.
      - name: The credential-free specs alone
        if: ${{ !cancelled() && env.CREDENTIAL_FREE == 'true' }}
        run: pnpm e2e
        env:
          CI: "true"
          E2E_BASE_URL: ${{ inputs.base_url || 'https://app.chanlytics.com' }}
      # The report can hold a real workspace's data, so it is kept only when
      # something failed and only for a week.
      - uses: actions/upload-artifact@v7
        if: failure() || cancelled()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
  # Somebody has to be told. The run starts in the night with nobody watching,
  # and its whole purpose is to notice things. One issue, not one a night:
  # a red run comments on it (the old per-night issues fold into it the
  # first time), a green run closes it, and the second red run in a row
  # pages the platform through the edge's pager door, once PAGER_URL and
  # PAGER_KEY are set (docs/runbook.md, What CI proves). A job the cap
  # cancelled is a job nobody heard from: it is red too. The issue says
  # which was red: the node suite, the whole suite, the check of production. The suite is green when its four parts
  # passed and what they ran of the code held its floors.
  report:
    name: Say what the night came to
    needs: [suite, coverage, whole, production]
    if: ${{ always() && !inputs.credential_free_only && !inputs.specs }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Say so, where a person will see it
        shell: bash
        run: |
          nightly=(--title "Nightly e2e is red" --match "Nightly e2e is red" --match "Nightly e2e failed " --match "Nightly e2e hit its cap ")
          if [ "$SUITE" = "success" ] && [ "$COVERAGE" != "success" ]; then SUITE="passed, but what it ran of the code was not held to its floors ($COVERAGE)"; fi
          if [ "$SUITE" = "success" ] && [ "$WHOLE" = "success" ] && [ "$PRODUCTION" = "success" ]; then
            node tooling/scripts/ops/rolling-issue.mjs --state green "${nightly[@]}"
          else
            echo "The nightly's node suite: $SUITE. The whole suite on its own stack: $WHOLE. The check of production: $PRODUCTION. A cancelled job hit its cap or was cancelled by hand before it finished; the run's jobs say which tests failed." > nightly.md
            node tooling/scripts/ops/rolling-issue.mjs --state red "${nightly[@]}" --body-file nightly.md --page-after 2 --condition nightly_red --assignee "$OWNER"
          fi
        env:
          SUITE: ${{ needs.suite.result }}
          COVERAGE: ${{ needs.coverage.result }}
          WHOLE: ${{ needs.whole.result }}
          PRODUCTION: ${{ needs.production.result }}
          # The red issue is the owner's: GitHub tells an assignee of every comment, and nobody else was told.
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGER_URL: ${{ secrets.PAGER_URL }}
          PAGER_KEY: ${{ secrets.PAGER_KEY }}
