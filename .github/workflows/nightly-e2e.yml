name: Nightly e2e

# The end-to-end suite against the deployed app, every morning.
#
# Every user-facing bug this project has shipped was found by loading the page
# and looking; the suite encodes that class of bug, and until now it ran only
# when somebody remembered to run it. 09:00 UTC is 05:00 in New York — before
# the salon opens, after the night's deploys.
#
# Two halves. The credential-free specs (the auth gate, no fabricated data)
# run on every schedule. The signed-in specs need a session minted with a
# service-role key and skip, with a stated reason, when the three secrets
# below are absent. ci.yml's rule — no live service secrets in CI — still
# holds for pull requests; whether this ONE scheduled job may hold them is
# the owner's decision, made by adding the secrets in the repository
# settings, and until then the job is honest about what it covered.
#
# A dispatch by hand may ask for the credential-free half alone, and point it
# at another address (one that needs no bypass): no secret is read, nothing is written, and
# no issue is filed or closed for a run that covered only part of the suite.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      credential_free_only:
        description: "Only the specs that need no credentials: no secret read, nothing written, no issue filed"
        type: boolean
        default: false
      base_url:
        description: "Where the credential-free specs run, an address that needs no bypass (a preview with protection off; preview-smoke.yml takes the protected ones); production when empty. The signed-in specs always run against production."
        type: string
        default: ""

# One run at a time. workspace-create.spec.ts really creates and deletes a
# tenant, `retries: 2` means up to three of those per run, and create_workspace
# allows five an hour -- so a manual dispatch overlapping the cron exhausts the
# budget and the spec then fails with "Too many new workspaces in a short
# time", which looks nothing like the bug anyone is chasing.
concurrency:
  group: nightly-e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright against production
    runs-on: ubuntu-latest
    # A green run takes about fifteen minutes; a run with a handful of failing specs takes their three tries each
    # on top. The cap was 30, and from 20 Sep every run hit it, so every run ended "cancelled" -- past the steps
    # below that say so, since a cancelled job is not a failed one. The cap leaves room for the failures to finish
    # and be reported; the steps below speak on a cancellation too.
    timeout-minutes: 60
    # Who the signed-in specs are, and who else is on their team: addresses at
    # example.com, which receive no mail. e2e-workspace.mjs makes both users
    # and their workspace; session.ts signs in as the first.
    env:
      E2E_USER_EMAIL: e2e-owner@example.com
      E2E_MEMBER_EMAIL: e2e-member@example.com
      # "true" for a dispatch that asked for the credential-free half alone; "false" on the schedule.
      CREDENTIAL_FREE: ${{ inputs.credential_free_only && 'true' || 'false' }}
    # issues: write is the whole point of the steps that say what happened -- a
    # red run at 09:00 that nobody is told about is the failure this suite
    # exists to prevent, one level up.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Ask's last 24 hours against the nightly's lines (the Ask Rewired Phase 6
      # plan, D4): a median cache hit under 50% or a median first text over 6 s
      # is a silent invalidator or a slow model, caught the day it lands. Read
      # only; the service key because a day's turns are every workspace's. Its
      # verdict is the output's last line. It exits 1 when Ask crossed a line and
      # 2 when the day could not be read at all (a variable missing, a read
      # refused): two different issues, never the suite's red (the scorecard's
      # I2:2).
      - name: Ask's cache and first words hold their lines
        id: ask_day
        if: ${{ !cancelled() && env.CREDENTIAL_FREE != 'true' }}
        shell: bash
        run: |
          set +e
          node tooling/scripts/ops/ask-day.mjs --check > ask-day.txt 2>&1
          code=$?
          cat ask-day.txt
          tail -n 1 ask-day.txt > ask-day-verdict.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
        env:
          SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SERVICE_ROLE_KEY }}
      - name: Say what Ask's day came to
        if: ${{ steps.ask_day.outcome == 'success' }}
        shell: bash
        run: |
          crossed=(--title "Ask's day crossed a line" --match "Ask's day crossed a line" --match "Ask's cache or first words crossed a line")
          unread=(--title "Ask's day could not be checked" --match "Ask's day could not be checked")
          case "$CODE" in
            0)
              node tooling/scripts/ops/rolling-issue.mjs --state green "${crossed[@]}"
              node tooling/scripts/ops/rolling-issue.mjs --state green "${unread[@]}"
              ;;
            1)
              node tooling/scripts/ops/rolling-issue.mjs --state red "${crossed[@]}" --body-file ask-day-verdict.txt
              node tooling/scripts/ops/rolling-issue.mjs --state green "${unread[@]}"
              ;;
            *)
              node tooling/scripts/ops/rolling-issue.mjs --state red "${unread[@]}" --body-file ask-day-verdict.txt
              ;;
          esac
        env:
          CODE: ${{ steps.ask_day.outputs.code }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm e2e:install
      # The integration suites talk to real Postgres. ci.yml holds no live
      # secrets by policy, so until now they ran NOWHERE — written tests
      # covering erasure, the message lifecycle, opt-out, the deadman and the
      # metrics, executed by nobody. SUPABASE_URL is what they read; passing
      # only NEXT_PUBLIC_SUPABASE_URL left them skipping even here.
      - name: Integration suites against real Postgres
        if: ${{ env.CREDENTIAL_FREE != 'true' }}
        run: pnpm test
        env:
          REQUIRE_SERVICE_CREDENTIALS: "1"
          SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SERVICE_ROLE_KEY }}
      # The run's own workspace, made or put back in its known state before any
      # spec signs in. The signed-in specs used to run as the owner's account in
      # a live customer's workspace, writing to it and spending Ask tokens there.
      # Now a test owner with exactly one membership signs in to fake people,
      # one conversation, one call and a WhatsApp channel with no credentials:
      # nothing in it can reach a customer or a provider, and the one address
      # its alerts go to is Resend's test inbox, which delivers nowhere.
      - name: The run's own workspace, in its known state
        if: ${{ !cancelled() && env.CREDENTIAL_FREE != 'true' }}
        run: node tooling/scripts/ops/e2e-workspace.mjs --apply
        env:
          SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SERVICE_ROLE_KEY }}
      - name: The signed-in specs and the credential-free ones
        if: ${{ !cancelled() && env.CREDENTIAL_FREE != 'true' }}
        run: pnpm e2e
        env:
          CI: "true"
          # Says this run is meant to be signed in, so skipping the signed-in
          # half is a failure rather than a quiet success. Not keyed on CI:
          # GitHub sets that for the pull-request job too, which is meant to
          # run credential-free.
          REQUIRE_SERVICE_CREDENTIALS: "1"
          E2E_BASE_URL: https://app.chanlytics.com
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SERVICE_ROLE_KEY }}
          # The one path that creates a user (signup.spec.ts sends a real code
          # and cleans up after itself) runs nightly, not on every pull request.
          E2E_SIGNUP_PROBE: "1"
          # Where that code goes: a real inbox, with {stamp} where each run's
          # fresh address differs (you+e2e-{stamp}@your-domain). Unset, the probe
          # skips and says why, since no example.com address can receive the code.
          # Adding the secret is the owner's call.
          E2E_SIGNUP_EMAIL: ${{ secrets.E2E_SIGNUP_EMAIL }}
          # E2E_PAID_MODEL is not set: the five Ask tests that run a real model
          # turn skip and say so. Set it to "1" on a run that should spend.
      # The credential-free half alone, by hand: no key of any kind in the
      # environment, so every signed-in spec skips and says why, and nothing
      # the run touches can write.
      - name: The credential-free specs alone
        if: ${{ !cancelled() && env.CREDENTIAL_FREE == 'true' }}
        run: pnpm e2e
        env:
          CI: "true"
          E2E_BASE_URL: ${{ inputs.base_url || 'https://app.chanlytics.com' }}
      # The report can hold a real workspace's data, so it is kept only when
      # something failed and only for a week.
      - uses: actions/upload-artifact@v7
        if: failure() || cancelled()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      # Somebody has to be told. The job runs at 09:00 with nobody watching,
      # and its whole purpose is to notice things. One issue, not one a night:
      # a red run comments on it (the old per-night issues fold into it the
      # first time), a green run closes it, and the second red run in a row
      # pages the platform through the edge's pager door, once PAGER_URL and
      # PAGER_KEY are set (docs/runbook.md, What CI proves). A run the cap
      # cancelled is a run nobody heard from: it is red too.
      - name: Say so, where a person will see it
        if: ${{ always() && env.CREDENTIAL_FREE != 'true' }}
        shell: bash
        run: |
          nightly=(--title "Nightly e2e is red" --match "Nightly e2e is red" --match "Nightly e2e failed " --match "Nightly e2e hit its cap ")
          if [ "$STATUS" = "success" ]; then
            node tooling/scripts/ops/rolling-issue.mjs --state green "${nightly[@]}"
          else
            if [ "$STATUS" = "cancelled" ]; then
              echo "The nightly suite was cancelled (the job cap, or by hand) before it finished." > nightly.md
            else
              echo "The nightly suite failed: the steps above in the run say which." > nightly.md
            fi
            node tooling/scripts/ops/rolling-issue.mjs --state red "${nightly[@]}" --body-file nightly.md --page-after 2 --condition nightly_red
          fi
        env:
          STATUS: ${{ job.status }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGER_URL: ${{ secrets.PAGER_URL }}
          PAGER_KEY: ${{ secrets.PAGER_KEY }}
