name: CI

on:
  pull_request:
  push:
    branches: [main]

# One run per pull request at a time: a push that supersedes a commit cancels
# the run that commit started, so minutes are spent only on what can merge.
# The included Actions minutes ran out on 11 September with two workflows on
# every push; this, and the paths in database.yml, are what makes them last.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    # gitleaks-action lists the PR's commits to scan only what the PR adds. The
    # default GITHUB_TOKEN cannot read pull_requests, so on the repo's first PR
    # the job died with "403 Resource not accessible by integration" — a scan
    # that never ran, reported as a failure indistinguishable from a real leak.
    # Read-only, and no more than the scan needs.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # workspace packages build to dist first; apps typecheck against the built types
      - run: pnpm --filter "./packages/*" build
      # dist-drift guard: the edge executes committed dist � stale dist = stale prod
      - run: git diff --exit-code -- packages/*/dist
      - run: pnpm -r typecheck
      # Static analysis across the WHOLE workspace. It covered only the
      # dashboard until apps/edge — the 1,600 lines a real customer message
      # travels through — turned out to be the one unlinted thing in the repo.
      - run: pnpm lint
      # `pnpm test`, not a second copy of the command: the suite needs Node's
      # type-stripping flags to import the dashboard's .ts modules, and a
      # duplicated invocation here silently ran without them — passing only
      # because this runner's Node happens to strip types by default.
      - run: pnpm test
      # database.types.ts freshness is proved in database.yml, where a database exists to regenerate from.
      # The production build, the way Vercel runs it for the dashboard (Root
      # Directory apps/dashboard, `next build`; Vercel's Node is 24, this job's
      # 22). Nothing above compiles a page: typecheck skips src/legacy, the
      # 28,000 lines of ported JSX, and no step prerendered a page or applied
      # Next's own rules, such as a "use client" page that may not export
      # metadata. Until this step a build failure first appeared as a failed
      # deployment. It lives in this job because branch protection requires
      # "Typecheck" by name, so a build that fails now blocks the merge.
      - uses: actions/cache@v4
        with:
          path: apps/dashboard/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/dashboard/app/**', 'apps/dashboard/src/**', 'apps/dashboard/middleware.ts', 'apps/dashboard/next.config.ts', 'packages/*/dist/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm --filter @chanlytics/dashboard build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # Placeholders the build never contacts. The static pages (/signup
          # among them) create their Supabase client while they prerender, and
          # @supabase/ssr refuses an empty URL or key, so without these the
          # build stops at /signup. Vercel builds with the real public values.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder

  # CI holds no live service secrets — tests run against fakes only (Blueprint §8).
