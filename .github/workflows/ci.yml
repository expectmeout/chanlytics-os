name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Typecheck/lint/test jobs land with the Phase 0 monorepo scaffold (pnpm + turbo).
  # CI never holds live service secrets — tests run against fakes only.
