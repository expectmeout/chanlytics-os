name: CI

on:
  # Not on `labeled`: any label started (and cancelled) the whole of CI again, required checks included, and a
  # Dependabot pull request opens with two. The `suite` label starts the suite alone, in suite.yml.
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  # A merge queue runs the required checks on the queue's own commit. Nothing here
  # needs it until the queue is turned on (a repository setting); then it works.
  merge_group:
  # The node suite by hand (both legs), when a pull request has none and someone wants one (below).
  workflow_dispatch:

# A pull request's runs share one group, and a push that supersedes a commit
# cancels the run that commit started, so minutes are spent only on what can
# merge. The included Actions minutes ran out on 11 September with two
# workflows on every push; this, and the paths in database.yml, are what makes
# them last. A push to main is never cancelled: main is verified after every
# merge. 44% of main's runs were cancelled before this (the scorecard's defect
# 15), and three of the reds they hid came from two green pull requests landing
# together. Each main commit is its own group, because a run queued behind
# another in a shared group is cancelled by the next one, whatever
# cancel-in-progress says.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Secret scan
    # The queue's commit is what the pull request's run already scanned, and the
    # action refuses merge_group events; a skipped required check passes.
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks-action lists the PR's commits to scan only what the PR adds. The
    # default GITHUB_TOKEN cannot read pull_requests, so on the repo's first PR
    # the job died with "403 Resource not accessible by integration" — a scan
    # that never ran, reported as a failure indistinguishable from a real leak.
    # Read-only, and no more than the scan needs.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The phone app's check, when a change could reach the app. The app is paused (7 October 2026), and this job
  # installs, builds every package, typechecks, lints, runs Expo's doctor and bundles both platforms: a little over
  # two minutes of a runner, which every pull request and every push to main spent for an app that 3 of main's last
  # 60 merges touched (9 October 2026). So its first step asks whether the change touches anything the app is built
  # from (tooling/scripts/checks/mobile-paths-changed.mjs: its own tree, the one module of the workspace it imports
  # and everything that reaches, what an install resolves), and every step after it waits for a yes. The job reports
  # either way, in seconds when the answer is no, so a rule that requires it by name still gets its check. A run
  # asked for by hand is a yes.
  mobile:
    name: Mobile (typecheck, lint, doctor, bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # the commit before this one too: the question is asked of this change's own files
          fetch-depth: 2
      - name: Could this change have reached the phone app?
        id: changed
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Asked for by hand, so the check runs."
            echo "mobile=true" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only HEAD^1 HEAD | node tooling/scripts/checks/mobile-paths-changed.mjs >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v6
        if: steps.changed.outputs.mobile == 'true'
      - uses: actions/setup-node@v7
        if: steps.changed.outputs.mobile == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.changed.outputs.mobile == 'true'
      # The shell: its types (with the routes' own, which typecheck generates first, so an address that names no
      # screen is an error), its own lint (Expo's config plus the layer rule), Expo's doctor, and a bundle for each
      # platform, the one check that proves Metro resolves everything the app imports from this workspace.
      - run: pnpm --filter @chanlytics/mobile typecheck
        if: steps.changed.outputs.mobile == 'true'
      - run: pnpm --filter @chanlytics/mobile lint
        if: steps.changed.outputs.mobile == 'true'
      # Named check:doctor because `pnpm doctor` is pnpm's own command and shadows a script by that name. Every doctor
      # check fails the job but one: whether the packages are the versions the installed SDK expects, which Expo's
      # own switch hands to the next step. Expo ships patch releases inside an SDK, and matching one changes the app's
      # fingerprint: a new preview APK, and no update reaches the installed one until it is replaced. That is the phone
      # app lane's to schedule, so drift warns here (docs/debt.md, the phone app's Expo packages).
      - run: pnpm --filter @chanlytics/mobile check:doctor
        if: steps.changed.outputs.mobile == 'true'
        env:
          EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: "1"
      - name: The Expo SDK's package versions, as a warning
        if: steps.changed.outputs.mobile == 'true'
        run: >-
          pnpm --filter @chanlytics/mobile exec expo install --check ||
          echo "::warning title=Expo packages behind the SDK::The versions above are not the ones the installed Expo SDK
          expects. Matching them builds a new preview APK; see docs/debt.md."
      - run: pnpm --filter @chanlytics/mobile export:check
        if: steps.changed.outputs.mobile == 'true'
        env:
          EXPO_PUBLIC_SITE_ORIGIN: https://example.com

  # Ruben, 10 Oct 2026: a push is through CI in under ten minutes. What was one job of fifteen steps in a row (seven
  # minutes of checks before a test ran, then the build) is four that run side by side once `scope` has answered, and
  # the check branch protection requires by name, Typecheck, is the last: a gate that passes when every part passed or
  # was not needed. The packages ship as their sources (decision 0074): the dashboard's build compiles them, the
  # typecheck reads them through their project references, and the tests build their own bundles. A pull request whose head carries the
  # line `corepack pnpm check:local` stamps, on the tree GitHub tests, skips what the laptop ran (lint, hygiene, the
  # tests, the typecheck); the build and the bundle run for every change (tooling/scripts/checks/checked-locally.mjs).
  scope:
    name: What this change needs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      checked: ${{ steps.checked.outputs.checked }}
    steps:
      # Two commits deep: on a pull request the checkout is the merge commit GitHub tests, whose first parent is the
      # base and whose second is the pull request's head.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # A pull request's title becomes the squash commit's subject: one sentence, at most 100 characters, no closing
      # period (README, Conventions). First, so a title that breaks it fails in seconds. A pull request opened before
      # 29 September 2026 is exempt, by its created_at, so the rule turned no open one red. The title and the time come
      # from the event through the environment, never inside the script's text; a re-run is given the same event, so a
      # title fixed in place is judged again by the next push. What lands is held on main by the `landed` job below.
      - if: github.event_name == 'pull_request'
        run: node tooling/scripts/checks/pr-title.mjs
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
      # checked=true only on a pull request whose head names its own tree in the stamp's line and whose merge into main
      # is that tree: when main has moved past the branch, the merge is a tree nobody checked, and everything runs.
      - id: checked
        name: Was this tree checked locally?
        env:
          EVENT: ${{ github.event_name }}
        run: node tooling/scripts/checks/checked-locally.mjs --ci >> "$GITHUB_OUTPUT"

  build:
    name: Build and bundle
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The bundle check reads the pull request's description as it runs (below), so a re-run reads an edited one; the
    # token reads nothing else.
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Two commits deep: the merge commit's first parent is the main commit the change stands on (the bundle, below).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The packages' sources compiled with the app, as Vercel builds (decision 0074).
      # The production build, the way Vercel runs it for the dashboard (Root
      # Directory apps/dashboard, `next build`, on Node 24 like this job). Nothing
      # above compiles a page: typecheck skips src/legacy, the ported JSX shell,
      # and no step prerendered a page or applied Next's own rules, such as a
      # "use client" page that may not export metadata. Until this step a build
      # failure first appeared as a failed deployment. Typecheck, the check branch
      # protection requires by name, needs this job, so a build that fails blocks
      # the merge.
      - uses: actions/cache@v6
        with:
          path: apps/dashboard/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/dashboard/app/**', 'apps/dashboard/src/**', 'apps/dashboard/proxy.ts', 'apps/dashboard/next.config.ts', 'packages/*/src/**', 'packages/*/package.json') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm --filter @chanlytics/dashboard build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # Placeholders the build never contacts. The static pages (/signup
          # among them) create their Supabase client while they prerender, and
          # @supabase/ssr refuses an empty URL or key, so without these the
          # build stops at /signup. Vercel builds with the real public values.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder
      # The signed-in frame is one prerender for every person and workspace (decision 0053, step 5): every page under
      # app/(os) built whole, nothing left to a request (tooling/scripts/checks/static-shell.mjs).
      - run: pnpm check:static-shell
      # What a browser loads to open a workspace grows only on purpose
      # (tooling/scripts/checks/bundle-budget.mjs). The build is deterministic to the byte.
      #
      # A push to main records its measurement under its own sha: in the Actions
      # cache, for the pull requests that stand on it, and as an artifact, for
      # the weekly reading (bundle-week.yml), which compares main with main a week
      # before. A pull request's checkout is the merge commit (fetch-depth 2
      # above), whose first parent is the main commit the change stands on: its
      # record is the base, and the difference is what this change adds, whatever
      # main carries. A sum grown past its line fails until the description says
      # why, in a line `Bundle: <why>`; the description is read here, as the step
      # runs, so after editing it, run the job again. Nothing in the repository
      # changes for it. The restore falls back to the newest record when main's
      # run for that commit has not saved yet, and the check then compares and
      # says so, holding the build to its ceiling alone. Every build, main's
      # included, is held to the ceilings (baselines/bundle-ceiling.json). The
      # record is written before the verdict and saved whatever the verdict.
      - name: The main commit this change stands on
        id: base
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: echo "sha=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        with:
          path: .bundle/record.json
          key: bundle-record-${{ steps.base.outputs.sha }}
          restore-keys: |
            bundle-record-
      - name: What this change adds to what a workspace loads
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          if [ -n "$PR" ]; then
            PR_BODY="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
            export PR_BODY
          fi
          pnpm check:bundle -- --against .bundle/record.json --base "$BASE" --summary "$GITHUB_STEP_SUMMARY"
      - if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        run: pnpm check:bundle -- --record .bundle/record.json --sha "${{ github.sha }}" --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && github.event_name == 'push' && hashFiles('.bundle/record.json') != '' }}
        with:
          path: .bundle/record.json
          key: bundle-record-${{ github.sha }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && github.event_name == 'push' && hashFiles('.bundle/record.json') != '' }}
        with:
          name: bundle-record
          path: .bundle/record.json
          retention-days: 35

  # Every project's types: each package checked once, under its own options, through the references `tsc -b` follows
  # (decision 0074), and the dashboard's route types written first (`next typegen`). database.types.ts freshness is
  # proved in database.yml, where a database exists to regenerate from.
  types:
    name: Types
    needs: scope
    if: needs.scope.outputs.checked != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck

  lint:
    name: Lint
    needs: scope
    if: needs.scope.outputs.checked != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ESLint's cache (tooling/scripts/checks/lint.mjs): a file whose content and config are as main last linted them
      # is not linted again, which takes the job from about four minutes to seconds. Main's own run after a merge lints
      # every file afresh (LINT_CACHE=0: a typed rule can turn on an unchanged file when a type it reads moved) and its
      # result is the cache a pull request starts from; a pull request's run saves its own for its next push.
      - uses: actions/cache@v6
        with:
          path: node_modules/.cache/eslint
          key: eslint-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs') }}-
      # Static analysis across the WHOLE workspace. It covered only the
      # dashboard until apps/edge — the 1,600 lines a real customer message
      # travels through — turned out to be the one unlinted thing in the repo.
      # An error fails here; the warnings, per file and rule, are the debt job's
      # to hold to the base (decision 0074).
      - run: pnpm lint
        env:
          LINT_CACHE: ${{ github.event_name == 'push' && '0' || '1' }}

  hygiene:
    name: Audit, licences and format
    needs: scope
    if: needs.scope.outputs.checked != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No production dependency with a known high or critical advisory (moderate ones are Dependabot's alerts,
      # lifted by overrides in pnpm-workspace.yaml), and none under a licence the product may not ship: GPL, AGPL or
      # one nobody has read (tooling/scripts/checks/licences.mjs). The audit reads the lockfile against the
      # registry's advisories, so a registry outage fails it too: re-run. An advisory with no patched version
      # anywhere (node-forge under Expo's CLI, GHSA-86w9-cpqp-85rv, 2 Oct 2026; braces under the same CLI's file map,
      # GHSA-vfj7-8cjw-p6xm, a stack-exhaustion denial of service on deeply nested glob patterns, 3 Oct 2026, build
      # time only, never in the app or a server; zod 3 under the same CLI, GHSA-mrhx-c7xc-m3w5, memory exhausted
      # validating oversized collections, 23 Oct 2026: fixed only in zod 4.6.6, which the CLI's ^3.25.76 cannot take,
      # and the dashboard and packages are on 4.6.7) is ignored by its GHSA in pnpm-workspace.yaml
      # (`auditConfig.ignoreGhsas`), each named here with the day and why; drop it once a fix ships.
      - run: pnpm audit --prod --audit-level high
      - name: Production licences are ones we may ship
        shell: bash
        run: pnpm licenses list --prod --json | node tooling/scripts/checks/licences.mjs
      # Formatting is checked, never fixed, here: the pre-commit hook formats
      # what is staged, and this step catches a commit made with the hook off. Prettier's cache (package.json's
      # format:check) keeps what main last found formatted, by content.
      - uses: actions/cache@v6
        with:
          path: node_modules/.cache/prettier
          key: prettier-${{ hashFiles('pnpm-lock.yaml', '.prettierrc*', '.prettierignore') }}-${{ github.sha }}
          restore-keys: |
            prettier-${{ hashFiles('pnpm-lock.yaml', '.prettierrc*', '.prettierignore') }}-
      - run: pnpm format:check

  # Every number the build holds, measured on the change's base and on its head (decision 0074): the measures of
  # tooling/scripts/tests/_measures.mjs, the lint's warnings and knip's dead exports. The base is the merge commit's
  # first parent, checked out here, measured by its own code, and the head checked out again; a base from before the
  # numbers left git is read from its baselines. A number that rose, or an offender that is new, fails until the
  # description says why, in a line `Debt: <why>`, read as the step runs (a re-run reads an edited one), as the bundle's
  # `Bundle:` is. A fall needs nothing, and nothing in the repository changes for either. It runs for every pull request,
  # a tree checked locally among them: what a change adds is measured against main, which a laptop's tree is not.
  debt:
    name: What this change owes
    needs: scope
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Two commits deep: the merge commit's first parent is the main commit the change stands on.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The lint's cache, as the lint job restores it: main's own run writes it afresh, so the base's files hit it.
      - uses: actions/cache/restore@v6
        with:
          path: node_modules/.cache/eslint
          key: eslint-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs') }}-
      - name: The base this change stands on, measured
        run: pnpm check:debt -- --base HEAD^1 --in-place --out .debt/base.json
      - name: What this change adds to it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PR" ]; then
            PR_BODY="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
            export PR_BODY
          fi
          pnpm check:debt -- --against .debt/base.json --summary "$GITHUB_STEP_SUMMARY"

  tests:
    name: Tests of what changed (${{ matrix.shard }}/4)
    needs: scope
    # The `suite` label asks for the whole suite whatever the laptop ran.
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') &&
      (needs.scope.outputs.checked != 'true' || contains(github.event.pull_request.labels.*.name, 'suite'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Four runners at once, each a quarter of the files (Node's --test-shard): one runner took seven to eight minutes
    # for a change that named 369 test files (16 Oct 2026), the longest wait of a push. A part that fails does not stop
    # the others, so one run says every failure. Typecheck, below, needs them all.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      # Two commits deep: on a pull request the checkout is the merge commit GitHub tests, whose first parent is the
      # base, so HEAD^1..HEAD is what the pull request changes (the changed tests, below).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm test`, not a second copy of the command: the suite needs Node's
      # type-stripping flags to import the dashboard's .ts modules, and a
      # duplicated invocation here silently ran without them — passing only
      # because this runner's Node happens to strip types by default.
      #
      # The whole suite runs only when asked for (Ruben, 1 Oct 2026: it took 27
      # minutes of every push, here and in the Auckland leg): on a pull request
      # with the `suite` label (adding it starts suite.yml; a later push runs it
      # here), or by hand (workflow_dispatch). Every other pull request runs the
      # tests of what it changed: the folders its paths name, the rules and the
      # ratchets always, and the tests whose imports reach a changed file, nearest
      # first, within 800 test files, never the whole suite (Ruben, 10 Oct 2026:
      # under ten minutes; tooling/scripts/checks/changed-tests.mjs). Without it a
      # pull request ran no test, and five ratchets went red on main unseen
      # between 29 Sep and 3 Oct; without the imports, five tests on 28 Oct. The
      # nightly runs the whole suite.
      - if: contains(github.event.pull_request.labels.*.name, 'suite') || github.event_name == 'workflow_dispatch'
        run: pnpm test -- --test-shard=${{ matrix.shard }}/4
      - name: The tests of what the pull request changed
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'suite')
        run: node tooling/scripts/checks/changed-tests.mjs HEAD^1 HEAD --test-shard=${{ matrix.shard }}/4

  # The check branch protection requires by name. Renamed, it would leave every pull request waiting for a check that
  # never reports. It runs whatever the parts said (always()), and fails when one failed or was cancelled; a part skipped
  # because the tree was checked locally, or because the event runs no tests (a push to main), is not a failure.
  typecheck:
    name: Typecheck
    needs: [scope, build, types, lint, hygiene, debt, tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part passed or was not needed
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' > /dev/null; then exit 1; fi

  # The node suite again, with the clock in Auckland (UTC+12, +13 in summer): a
  # rule that reads the viewer's zone instead of the workspace's gives the wrong
  # day there (the scorecard's defect 28 wrote Tuesday's key as Wednesday), and
  # the suite otherwise runs only where CI and Vercel are, in UTC. The launcher
  # builds the packages' bundles the suite imports; not a required check.
  #
  # Green since the tests lane, and a failure fails the run like any leg's: the
  # 29 tests that built a date with no zone or read the day in the machine's
  # failed under it on 29 Sep 2026 (billing, calendar, broadcasts, business tab,
  # the day stepper), and each now names the instant it means or pins the clock.
  # TEST_TZ is the zone the launcher (tooling/scripts/checks/test.mjs) reads, TZ
  # the one node reads. Like the UTC leg above, it runs only when asked for: the
  # `suite` label on the pull request, or by hand.
  auckland:
    name: Node suite, Pacific/Auckland
    if: contains(github.event.pull_request.labels.*.name, 'suite') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
        env:
          TZ: Pacific/Auckland
          TEST_TZ: Pacific/Auckland

  # The title check above holds a pull request's title, but the squash subject
  # is typed at merge: #1329's 92-character title landed as a 122-character
  # subject, and #1243 landed as a merge commit (the scorecard's I2:1 and B2:4).
  # So each push to main checks what it landed. What landed cannot be undone,
  # so a break is an issue for the next merger to read, not a red build.
  landed:
    name: What landed keeps the title rule
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: subjects
        name: Read what the push landed
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set +e
          node tooling/scripts/checks/pr-title.mjs --landed "$BEFORE" "$AFTER" > landed.txt
          code=$?
          cat landed.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 1 is a subject that breaks the rule; anything else is the check itself failing.
          [ "$code" -le 1 ]
      - if: steps.subjects.outputs.code == '1'
        name: Say so where the next merger will see it
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            cat landed.txt
            echo
            echo "The squash subject is typed at merge: keep the pull request's title, which CI checked, and GitHub's (#N) after it; merge with Squash and merge (README, Conventions)."
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > issue.md
          title="What landed on main breaks the title rule (${GITHUB_SHA:0:9})"
          # A re-run of this job finds its issue already open.
          if gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json title --jq '.[].title' | grep -qxF "$title"; then
            echo "The issue is already open: $title"
          else
            gh issue create --title "$title" --body-file issue.md --repo "$GITHUB_REPOSITORY"
          fi

  # CI holds no live service secrets: the tests run against fakes only (Blueprint §8).
