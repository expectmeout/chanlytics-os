name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # workspace packages build to dist first; apps typecheck against the built types
      - run: pnpm --filter "./packages/*" build
      # dist-drift guard: the edge executes committed dist � stale dist = stale prod
      - run: git diff --exit-code -- packages/*/dist
      - run: pnpm -r typecheck
      # Static analysis on the UI, which had none. The rule that earns this is
      # react-hooks/exhaustive-deps — stale dep arrays are the defect family
      # behind most of what we have called "glitchy".
      - run: pnpm --filter @chanlytics/dashboard lint
      - run: node --test tooling/scripts/tests/*.test.mjs
      # generated-types freshness: regen must produce no diff (CI has no Supabase
      # access token, so this runs only when the schema changed in the commit).
      # The gen runs locally with every migration per the blueprint's §8 rule.

  # CI holds no live service secrets — tests run against fakes only (Blueprint §8).
