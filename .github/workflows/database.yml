name: Database

# Every migration replayed from zero on a fresh Postgres, then the rules that
# live in SQL proved against it. ci.yml runs the unit suite against fakes, which
# cannot see a CHECK, a trigger or a SKIP LOCKED; this can. It is also the only
# place the migrations are applied to anything but production before they are.
#
# It reports on every pull request, so branch protection can require it, and it
# replays only when the database could have changed. The first step pipes the
# changed files through tooling/scripts/checks/changed/database.mjs, which holds the
# one list of what the replay depends on: the migrations, seed and config under
# supabase/, the SQL suites, the db package's src (the *.integration suites call
# its repositories through the bundle the launcher builds), what the two --check steps
# compare, and what this workflow installs. A pull request that touches none of
# them gets that sentence and a pass without a Supabase stack being started, and
# a push to main asks the same question of everything since main's last replay
# that passed. Two workflows on every push spent the included minutes by 11
# September; the question costs a checkout and a git diff.
#
# Either deploy order, held on a pull request (28 Nov 2026). Every migration
# says its order, and a migration is applied before its merge, so the code that
# meets it first is the release before it. Two steps hold that: a function
# written again still takes the call main's code makes (deploy-order/old-callers.mjs, read
# from the schema's snapshot at the base and at the head, on every pull
# request), and, where the pull request adds a migration, the base's own
# database suites that read what it writes pass against the new schema
# (deploy-order/last-release-suites.mjs). A suite the migration fails on purpose is argued
# in the description, `Last release: <why>`. By hand, `last_release` names a
# commit to take as the base, for the proof of a migration already on a branch,
# and `argued` gives the reason a description would; such a run replays and
# runs that leg alone, and its summary says what the old release came to.
on:
  pull_request:
  push:
    branches: [main]
  # A merge queue runs the required checks on the queue's own commit (ci.yml).
  merge_group:
  workflow_dispatch:
    inputs:
      last_release:
        description: "A commit to take as the last release: its database suites that read what this branch's migrations write are run against this branch's schema, and nothing else is"
        type: string
        default: ""
      argued:
        description: "Why a suite of that release fails on purpose, where one does: what a pull request's description says after 'Last release:'"
        type: string
        default: ""

# As ci.yml: a pull request's newer run cancels its older one, and a main commit
# is never cancelled, each in a group of its own.
concurrency:
  group: database-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  replay:
    # A required check is matched by this name. Renamed, it would leave every
    # pull request waiting for a check that never reports.
    name: Migrations replay, SQL rules hold
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # actions: read, for the push's question: which main commit last replayed green. pull-requests: read, for the
    # description's `Last release:` line.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      # The whole history, so the diff below has its base to compare with.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The answer goes to the step's outputs and the reason to the log. A git
      # diff that fails, or a script that crashes, fails this step instead of
      # reading as "not needed" and skipping the replay.
      #
      # A push to main asks about everything since the last main commit whose
      # replay passed, not only its own push: a replay that was cancelled, died
      # on the runner, or never started (the spending-limit block of 28 Sep) is
      # made up by the next push. Asking only of its own push, a successor
      # answered "not needed" while the merge before it carried a migration
      # nothing had replayed (the scorecard's defect 62: 00237). History that
      # cannot be read, or a last green commit main no longer holds, replays.
      - id: changed
        name: Could the database have changed?
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
          AFTER: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$EVENT" = "push" ]; then
            # The one part that needs the network; a history that cannot be read is no last green, and replays.
            LAST_GREEN="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow database.yml --branch main --event push --status success --limit 1 --json headSha --jq '.[0].headSha // ""')" || LAST_GREEN=""
            export LAST_GREEN
          fi
          # Which range is asked of, and the answer: tooling/scripts/checks/replay-range.mjs (held by
          # tests/database/replay-range.test.mjs).
          node tooling/scripts/checks/replay-range.mjs >> "$GITHUB_OUTPUT"
      # The node suite holds the migrations folder to supabase/migrations-ledger.json, and a folder and a ledger edited
      # together agree. So a pull request's ledger is held to main's too: every entry main recorded, unchanged, whatever
      # the diff touches (tooling/scripts/checks/migration-ledger.mjs --base). Main has no ledger before the pull request
      # that adds it, and this passes there.
      - if: github.event_name == 'pull_request'
        name: The ledger keeps what main recorded
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node tooling/scripts/checks/migration-ledger.mjs --base "origin/$BASE_REF"
      # A migration is applied before its merge, so main's code meets it first. A function the base's code calls keeps
      # the arguments that call gives, by name, place and type, and what it answers; one that must change behind the
      # code says "Deploy order: after the deploys" in its migration (tooling/scripts/checks/deploy-order/old-callers.mjs). Read from
      # supabase/schema.sql at the base and at the head: no stack, and a pass in a second where the schema did not move.
      - if: github.event_name == 'pull_request'
        name: A function written again still takes the last release's call
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node tooling/scripts/checks/deploy-order/old-callers.mjs --base "origin/$BASE_REF"
      - if: steps.changed.outputs.db == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.changed.outputs.db == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - if: steps.changed.outputs.db == 'true'
        uses: supabase/setup-cli@v3
        with:
          version: 2.116.0
      - if: steps.changed.outputs.db == 'true'
        run: pnpm install --frozen-lockfile
      # ghcr.io answers a burst of image pulls with "toomanyrequests" and a
      # retry-after of microseconds, which the daemon does not wait out, so one
      # start can fail with most of the layers already down (23 September 2026:
      # every replay for hours). A failed start keeps what it pulled, so a few
      # more attempts, spaced out, finish the set; six failures still fail here.
      - if: steps.changed.outputs.db == 'true'
        run: |
          for attempt in 1 2 3 4 5 6; do
            if supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector; then exit 0; fi
            echo "supabase start failed on attempt $attempt; pulling the rest after a pause" >&2
            supabase stop --no-backup || true
            sleep $((attempt * 15))
          done
          exit 1
      # Every closed set the migrations declare, regenerated from the database.
      # A migration that changed one without regenerating fails here, and the
      # compiler then names every copy the change left behind.
      - if: steps.changed.outputs.db == 'true'
        run: node tooling/scripts/gen/schema-sets.mjs --check
      # database.types.ts regenerated from the same database and compared, with
      # PostgREST's version and the month's events partitions ignored.
      # Red: supabase start && corepack pnpm gen:db-types
      - if: steps.changed.outputs.db == 'true'
        run: node tooling/scripts/gen/db-types.mjs --check
      # The local stack's service and anon keys are the published demo keys, not
      # secrets. The anon key is what the RLS suites sign real sessions in with.
      - name: Point the suite at the local database
        if: steps.changed.outputs.db == 'true'
        run: |
          echo "SUPABASE_URL=http://127.0.0.1:54321" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o env | sed -n 's/^SERVICE_ROLE_KEY="\(.*\)"$/\1/p')" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$(supabase status -o env | sed -n 's/^ANON_KEY="\(.*\)"$/\1/p')" >> "$GITHUB_ENV"
      # Every database suite on a push to main (and a merge queue's commit); on a pull request, the ones that lie where
      # its changes name and that read what its migrations change (tooling/scripts/checks/changed-tests.mjs --db: a
      # migration names tests/database, and its text the suites that walk the catalog or say a function it writes or a
      # table whose rows it adds or removes). The whole set took ten of the replay's thirteen minutes on 10 Oct 2026, and
      # Ruben's line is under ten for a push; main runs them all after the merge, and the nightly every night
      # (nightly-database.yml).
      - if: steps.changed.outputs.db == 'true' && github.event_name != 'pull_request' && inputs.last_release == ''
        run: pnpm test:db
      - name: The database suites of what the pull request changed
        if: steps.changed.outputs.db == 'true' && github.event_name == 'pull_request'
        run: node tooling/scripts/checks/changed-tests.mjs --db HEAD^1 HEAD
      # The other deploy order: the base's code on this schema. The base is checked out beside the branch, and its own
      # database suites that say a function or a table the added migrations write run against the stack above
      # (tooling/scripts/checks/deploy-order/last-release-suites.mjs). Nothing runs where no migration is added. A suite the
      # migration fails on purpose passes the step when the description says `Last release: <why>`.
      - name: The last release's database suites, against this schema
        if: steps.changed.outputs.db == 'true' && (github.event_name == 'pull_request' || inputs.last_release != '')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          LAST_RELEASE: ${{ inputs.last_release }}
          ARGUED: ${{ inputs.argued }}
        run: |
          if [ -n "$PR" ]; then
            PR_BODY="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
            export PR_BODY
          elif [ -n "$ARGUED" ]; then
            # A run by hand has no description: its reason is the input.
            export PR_BODY="Last release: $ARGUED"
          fi
          node tooling/scripts/checks/deploy-order/last-release-suites.mjs "${LAST_RELEASE:-HEAD^1}" HEAD
      - if: always() && steps.changed.outputs.db == 'true'
        run: supabase stop --no-backup
