name: Database

# Every migration replayed from zero on a fresh Postgres, then the rules that
# live in SQL proved against it. ci.yml runs the unit suite against fakes, which
# cannot see a CHECK, a trigger or a SKIP LOCKED; this can. It is also the only
# place the migrations are applied to anything but production before they are.
#
# It runs when the database could have changed. The replay depends on the
# migrations, the seed and the config under supabase/, on the SQL suites, and
# on the generated sets the --check compares with the database. The *.db
# suites reach Postgres through supabase-js alone; the *.integration suites
# (eleven of them, written against a live database and skipped everywhere
# else for a year) also call the db package's repositories -- ingestCall,
# resolveOutboundTarget, readThreadState -- through its committed dist, which
# is why packages/db/src is a trigger too. Branch protection requires Secret
# scan and Typecheck only, so a pull request that leaves the database alone
# is not held for a check that did not run. Two workflows on every push spent
# the included minutes by 11 September.
on:
  pull_request:
    paths:
      - "supabase/**"
      - "tooling/scripts/tests/*.db.test.mjs"
      - "tooling/scripts/tests/*.integration.test.mjs"
      - "packages/db/src/**"
      - "tooling/scripts/gen-schema-sets.mjs"
      - "tooling/scripts/check-db-types.mjs"
      - "packages/contracts/src/schema-sets.generated.ts"
      - ".github/workflows/database.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "tooling/scripts/tests/*.db.test.mjs"
      - "tooling/scripts/tests/*.integration.test.mjs"
      - "packages/db/src/**"
      - "tooling/scripts/gen-schema-sets.mjs"
      - "tooling/scripts/check-db-types.mjs"
      - "packages/contracts/src/schema-sets.generated.ts"
      - ".github/workflows/database.yml"
      - "package.json"
      - "pnpm-lock.yaml"

concurrency:
  group: database-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: Migrations replay, SQL rules hold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - run: pnpm install --frozen-lockfile
      - run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector
      # Every closed set the migrations declare, regenerated from the database.
      # A migration that changed one without regenerating fails here, and the
      # compiler then names every copy the change left behind.
      - run: node tooling/scripts/gen-schema-sets.mjs --check
      # database.types.ts regenerated from the same database and compared, one
      # line ignored (PostgREST's version). Red: supabase start && corepack pnpm gen:db-types
      - run: node tooling/scripts/check-db-types.mjs --check
      # The local stack's service and anon keys are the published demo keys, not
      # secrets. The anon key is what the RLS suites sign real sessions in with.
      - name: Point the suite at the local database
        run: |
          echo "SUPABASE_URL=http://127.0.0.1:54321" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o env | sed -n 's/^SERVICE_ROLE_KEY="\(.*\)"$/\1/p')" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$(supabase status -o env | sed -n 's/^ANON_KEY="\(.*\)"$/\1/p')" >> "$GITHUB_ENV"
      - run: pnpm test:db
      - if: always()
        run: supabase stop --no-backup
