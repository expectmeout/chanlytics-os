name: Database

# Every migration replayed from zero on a fresh Postgres, then the rules that
# live in SQL proved against it. ci.yml runs the unit suite against fakes, which
# cannot see a CHECK, a trigger or a SKIP LOCKED; this can. It is also the only
# place the migrations are applied to anything but production before they are.
#
# It reports on every pull request, so branch protection can require it, and it
# replays only when the database could have changed. The first step pipes the
# changed files through tooling/scripts/checks/db-paths-changed.mjs, which holds the
# one list of what the replay depends on: the migrations, seed and config under
# supabase/, the SQL suites, the db package's src (the *.integration suites call
# its repositories through the committed dist), what the two --check steps
# compare, and what this workflow installs. A pull request that touches none of
# them gets that sentence and a pass without a Supabase stack being started, and
# a push to main asks the same question of everything since main's last replay
# that passed. Two workflows on every push spent the included minutes by 11
# September; the question costs a checkout and a git diff.
on:
  pull_request:
  push:
    branches: [main]
  # A merge queue runs the required checks on the queue's own commit (ci.yml).
  merge_group:

# As ci.yml: a pull request's newer run cancels its older one, and a main commit
# is never cancelled, each in a group of its own.
concurrency:
  group: database-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  replay:
    # A required check is matched by this name. Renamed, it would leave every
    # pull request waiting for a check that never reports.
    name: Migrations replay, SQL rules hold
    runs-on: ubuntu-latest
    # actions: read, for the push's question: which main commit last replayed green.
    permissions:
      contents: read
      actions: read
    steps:
      # The whole history, so the diff below has its base to compare with.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The answer goes to the step's outputs and the reason to the log. A git
      # diff that fails, or a script that crashes, fails this step instead of
      # reading as "not needed" and skipping the replay.
      #
      # A push to main asks about everything since the last main commit whose
      # replay passed, not only its own push: a replay that was cancelled, died
      # on the runner, or never started (the spending-limit block of 28 Sep) is
      # made up by the next push. Asking only of its own push, a successor
      # answered "not needed" while the merge before it carried a migration
      # nothing had replayed (the scorecard's defect 62: 00237). History that
      # cannot be read, or a last green commit main no longer holds, replays.
      - id: changed
        name: Could the database have changed?
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
          AFTER: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$EVENT" = "push" ]; then
            # The one part that needs the network; a history that cannot be read is no last green, and replays.
            LAST_GREEN="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow database.yml --branch main --event push --status success --limit 1 --json headSha --jq '.[0].headSha // ""')" || LAST_GREEN=""
            export LAST_GREEN
          fi
          # Which range is asked of, and the answer: tooling/scripts/checks/replay-range.mjs (held by
          # tests/database/replay-range.test.mjs).
          node tooling/scripts/checks/replay-range.mjs >> "$GITHUB_OUTPUT"
      # The node suite holds the migrations folder to supabase/migrations-ledger.json, and a folder and a ledger edited
      # together agree. So a pull request's ledger is held to main's too: every entry main recorded, unchanged, whatever
      # the diff touches (tooling/scripts/checks/migration-ledger.mjs --base). Main has no ledger before the pull request
      # that adds it, and this passes there.
      - if: github.event_name == 'pull_request'
        name: The ledger keeps what main recorded
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node tooling/scripts/checks/migration-ledger.mjs --base "origin/$BASE_REF"
      - if: steps.changed.outputs.db == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.changed.outputs.db == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - if: steps.changed.outputs.db == 'true'
        uses: supabase/setup-cli@v3
        with:
          version: 2.116.0
      - if: steps.changed.outputs.db == 'true'
        run: pnpm install --frozen-lockfile
      # ghcr.io answers a burst of image pulls with "toomanyrequests" and a
      # retry-after of microseconds, which the daemon does not wait out, so one
      # start can fail with most of the layers already down (23 September 2026:
      # every replay for hours). A failed start keeps what it pulled, so a few
      # more attempts, spaced out, finish the set; six failures still fail here.
      - if: steps.changed.outputs.db == 'true'
        run: |
          for attempt in 1 2 3 4 5 6; do
            if supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector; then exit 0; fi
            echo "supabase start failed on attempt $attempt; pulling the rest after a pause" >&2
            supabase stop --no-backup || true
            sleep $((attempt * 15))
          done
          exit 1
      # Every closed set the migrations declare, regenerated from the database.
      # A migration that changed one without regenerating fails here, and the
      # compiler then names every copy the change left behind.
      - if: steps.changed.outputs.db == 'true'
        run: node tooling/scripts/gen/schema-sets.mjs --check
      # database.types.ts regenerated from the same database and compared, with
      # PostgREST's version and the month's events partitions ignored.
      # Red: supabase start && corepack pnpm gen:db-types
      - if: steps.changed.outputs.db == 'true'
        run: node tooling/scripts/gen/db-types.mjs --check
      # The local stack's service and anon keys are the published demo keys, not
      # secrets. The anon key is what the RLS suites sign real sessions in with.
      - name: Point the suite at the local database
        if: steps.changed.outputs.db == 'true'
        run: |
          echo "SUPABASE_URL=http://127.0.0.1:54321" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o env | sed -n 's/^SERVICE_ROLE_KEY="\(.*\)"$/\1/p')" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$(supabase status -o env | sed -n 's/^ANON_KEY="\(.*\)"$/\1/p')" >> "$GITHUB_ENV"
      - if: steps.changed.outputs.db == 'true'
        run: pnpm test:db
      - if: always() && steps.changed.outputs.db == 'true'
        run: supabase stop --no-backup
