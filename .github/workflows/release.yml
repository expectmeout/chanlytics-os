name: Release

# A tag and a release per deploy. A merge to main deploys both Vercel projects
# (docs/runbook.md, Deploy), and until this nothing marked which merge a
# deployment was: 0 tags, 0 releases, no note. Each push to main is tagged
# vYYYY.MM.DD-<sha>, and its release note lists the pull requests merged since
# the tag before it (tooling/scripts/ops/release-note.mjs). A rollback names
# the tag it goes back to. No install: the script needs node and git alone.
on:
  push:
    branches: [main]

# One at a time, in order, never cancelled mid-way. A push queued behind another
# is replaced by the next one; its pull requests then land in the next note.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    name: Tag and note what deployed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Tag this merge and publish its note
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$(node tooling/scripts/ops/release-note.mjs --tag "$GITHUB_SHA")"
          node tooling/scripts/ops/release-note.mjs --to "$GITHUB_SHA" > release.md
          cat release.md
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file release.md --repo "$GITHUB_REPOSITORY"
