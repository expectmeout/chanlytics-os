# Dependencies, kept current on a schedule instead of by surprise. Weekly, on
# Monday, grouped so a week's minors and patches arrive as one pull request
# and cost one CI run; a major arrives on its own, because a major is a
# decision. Security updates are the repository setting beside this file.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 4
    ignore:
      # @types/node describes the Node the code runs on, and that is 22 (.nvmrc,
      # CI and the engines field). A newer major would type APIs the runtime
      # does not have, so it moves when the runtime does.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is the native compiler with a new API; tsup's --dts (every
      # package build) dies on it (`useCaseSensitiveFileNames` of undefined) and
      # Next 15's type plugin is not on it either. It moves when the toolchain
      # does (#401 was that bump, closed).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    commit-message:
      prefix: "deps(actions)"
