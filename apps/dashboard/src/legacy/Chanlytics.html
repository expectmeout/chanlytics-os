  <script type="text/babel" data-presets="env,react">
    const { useEffect, useCallback } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "theme": "dark",
      "inboxDensity": "compact",
      "showInboxAgentRail": false
    }/*EDITMODE-END*/;

    function App() {
      const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const theme = tweaks.theme;
      const setTheme = useCallback((v) => setTweak("theme", v), [setTweak]);

      useEffect(() => {
        document.documentElement.setAttribute("data-theme", theme);
      }, [theme]);

      return (
        <>
          <ChanlyticsApp
            theme={theme}
            onTheme={setTheme}
            inboxDensity={tweaks.inboxDensity}
            showInboxAgentRail={tweaks.showInboxAgentRail}
          />

          <TweaksPanel title="Tweaks">
            <TweakSection title="Appearance">
              <TweakRadio
                label="Theme"
                value={theme}
                options={[{ value: "light", label: "Light" }, { value: "dark", label: "Dark" }]}
                onChange={setTheme}
              />
            </TweakSection>

            <TweakSection title="Inbox">
              <TweakRadio
                label="Density"
                value={tweaks.inboxDensity}
                options={[
                  { value: "compact", label: "Compact" },
                  { value: "medium", label: "Medium" },
                  { value: "rich", label: "Rich" }
                ]}
                onChange={(v) => setTweak("inboxDensity", v)}
              />
              <TweakToggle
                label="Show agent context rail"
                value={tweaks.showInboxAgentRail}
                onChange={(v) => setTweak("showInboxAgentRail", v)}
              />
            </TweakSection>

            <TweakSection title="About">
              <div style={{ fontSize: 12, color: "var(--ink-muted)", lineHeight: 1.5 }}>
                Live app shell — sidebar, bell, and every row navigate for real (⌘K opens Ask anywhere).
                Unbuilt surfaces land on an in-design page instead of dead-ending.
              </div>
            </TweakSection>
          </TweaksPanel>
        </>
      );
    }

    // Boot gate — the data-before-mount contract made explicit (Architecture audit §04).
    // Backend swap: fetch real data, populate these globals, THEN render. Same gate.
    const REQUIRED = ["CHANLY", "INBOX_DATA", "CLIENTS", "FLEET_DATA", "CHANLY_DATA", "POLICY", "ChanlyticsApp"];
    const missing = REQUIRED.filter((k) => !window[k]);
    if (missing.length) {
      document.getElementById("root").innerHTML = '<div style="height:100vh;display:grid;place-items:center;font-family:Geist,sans-serif;color:#666"><div style="text-align:center"><div style="font-size:15px;font-weight:600;color:#333">Chanlytics didn\'t finish loading</div><div style="font-size:13px;margin-top:6px">Missing: ' + missing.join(", ") + ' — refresh to retry.</div></div></div>';
    } else {
      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    }
  </script>
