  <script type="text/babel" data-presets="env,react">
    const { useEffect, useCallback } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "theme": "dark",
      "look": "classic",
      "inboxDensity": "compact",
      "showInboxAgentRail": false
    }/*EDITMODE-END*/;

    // The tweaks panel was removed with the rest of the unloaded mockup files
    // (#89) and its <script> tag outlived it, so this harness has been throwing
    // "useTweaks is not defined" on boot ever since. The two knobs it carried
    // that the shell still reads are defaults here; theme is a real control
    // because a design pass needs to see both. The look is stamped beside it,
    // as the app stamps it, so a [data-look] rule draws here as it does there.
    function App() {
      const [theme, setTheme] = React.useState(TWEAK_DEFAULTS.theme);
      const [look, setLook] = React.useState(TWEAK_DEFAULTS.look);
      useEffect(() => { document.documentElement.setAttribute("data-theme", theme); }, [theme]);
      useEffect(() => { document.documentElement.setAttribute("data-look", look); }, [look]);
      useEffect(() => {
        const onKey = (e) => {
          if (e.key !== "t" || e.metaKey || e.ctrlKey || e.altKey) return;
          const tag = (e.target.tagName || "").toLowerCase();
          if (tag === "input" || tag === "textarea" || e.target.isContentEditable) return;
          setTheme((v) => (v === "dark" ? "light" : "dark"));
        };
        window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
      }, []);
      return (
        <ChanlyticsApp
          theme={theme}
          onTheme={setTheme}
          look={look}
          onLook={setLook}
          inboxDensity={TWEAK_DEFAULTS.inboxDensity}
          showInboxAgentRail={TWEAK_DEFAULTS.showInboxAgentRail}
        />
      );
    }

    // Boot gate — the data-before-mount contract made explicit (Architecture audit §04).
    // Backend swap: fetch real data, populate these globals, THEN render. Same gate.
    const REQUIRED = ["CHANLY", "INBOX_DATA", "CLIENTS", "FLEET_DATA", "CHANLY_DATA", "POLICY", "ChanlyticsApp"];
    const missing = REQUIRED.filter((k) => !window[k]);
    if (missing.length) {
      document.getElementById("root").innerHTML = '<div style="height:100vh;display:grid;place-items:center;font-family:Geist,sans-serif;color:#666"><div style="text-align:center"><div style="font-size:15px;font-weight:600;color:#333">Chanlytics didn\'t finish loading</div><div style="font-size:13px;margin-top:6px">Missing: ' + missing.join(", ") + ' — refresh to retry.</div></div></div>';
    } else {
      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    }
  </script>
