# One tab, by the system bar's own item (Android): TAB is the tab's word. The item is found by what it holds, the bar's
# content container, never by the word alone, since a page may say it too (People's ⋯ button is "More", the Calendar
# has a "Today" button). It is pressed only when it is not already in front: the item in front takes no click, and
# its container is hidden from accessibility then. Then the tab must be in front, and its page not the offline screen.
appId: com.chanlytics.app
---
- runFlow:
    when:
      visible:
        text: ${TAB}
        containsChild:
          id: .*navigation_bar_item_content_container
    commands:
      - tapOn:
          text: ${TAB}
          containsChild:
            id: .*navigation_bar_item_content_container
      - waitForAnimationToEnd:
          timeout: 5000
- assertVisible:
    text: ${TAB}
    selected: true
- assertNotVisible: No connection
