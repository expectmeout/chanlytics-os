# The release: a tag v1.2.3 fingerprints the native code, reuses a store build whose fingerprint matches (then only an
# update ships), else builds both platforms and submits them. Expo's own golden path; the submit profiles are in
# eas.json and need the App Store Connect API key and the Play service account in EAS credentials (PR 6 of the app).
name: Deploy to the stores
on:
  push:
    tags: ["v*.*.*", "!v*.*.*-rc.*"]
jobs:
  fingerprint:
    type: fingerprint
  get_ios_build:
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      profile: production
  get_android_build:
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      profile: production
  build_ios:
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: production
  build_android:
    needs: [get_android_build]
    if: ${{ !needs.get_android_build.outputs.build_id }}
    type: build
    params:
      platform: android
      profile: production
  submit_ios:
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
  submit_android:
    needs: [build_android]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production
  update:
    needs: [get_ios_build, get_android_build]
    if: ${{ needs.get_ios_build.outputs.build_id || needs.get_android_build.outputs.build_id }}
    type: update
    params:
      branch: production
      message: ${{ github.ref_name }}
