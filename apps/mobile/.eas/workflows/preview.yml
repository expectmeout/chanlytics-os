# The preview app on main: what a tester installs before the stores. A build is one of the plan's builds, so the
# shell is built only when its native code changed (no preview build carries this fingerprint yet); a change to the
# screens, the bridge or the contracts they bundle reaches the installed preview app as an update on its channel, on
# the next launch. iOS has no preview build until the Apple account exists (an internal iOS build needs its
# credentials); a simulator build is asked for by hand with the development-simulator profile.
#
# It runs only for what the app is made of: its own tree, the versions it is built with, the entry it imports
# contracts through (the package's exports) and the modules that entry reaches. The rest of contracts is the web's,
# and publishing an update for every change to it (most pull requests) spent a run on an app nothing had changed in.
# apps/mobile/test/preview-paths.test.mjs holds the contracts lines to what src/mobile/phone-app.ts imports.
name: Preview
on:
  push:
    branches: [main]
    paths:
      - apps/mobile/**
      - pnpm-lock.yaml
      - packages/contracts/package.json
      - packages/contracts/src/mobile/**
      - packages/contracts/src/shared/identity.ts
      - packages/contracts/src/shared/phone.ts
      - packages/contracts/src/shared/time.ts
      - packages/contracts/src/shell/chrome.ts
      - packages/contracts/src/workspace/billing.ts
jobs:
  fingerprint:
    type: fingerprint
    environment: preview
  get_android_build:
    needs: [fingerprint]
    type: get-build
    params:
      platform: android
      profile: preview
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      wait_for_in_progress: true
  build_android:
    needs: [get_android_build]
    if: ${{ !needs.get_android_build.outputs.build_id }}
    type: build
    params:
      platform: android
      profile: preview
  update_android:
    needs: [get_android_build]
    if: ${{ needs.get_android_build.outputs.build_id }}
    type: update
    environment: preview
    params:
      platform: android
      channel: preview
