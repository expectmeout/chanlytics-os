# The preview app: what a tester installs before the stores. Run by hand, and only on Ruben's word: the phone app is
# paused (7 October 2026) and nothing in this repository sends anything to Expo by itself. A run spends the plan's
# minutes, and a build its credit. From apps/mobile:
#   npx eas-cli@latest workflow:run .eas/workflows/preview.yml
#
# A build is one of the plan's builds, so the shell is built only when its native code changed (no preview build
# carries this fingerprint yet); otherwise what the run's commit holds reaches the installed preview app as an update
# on its channel, on the next launch. iOS has no preview build until the Apple account exists (an internal iOS build
# needs its credentials); a simulator build is asked for by hand with the development-simulator profile.
#
# Until 7 October it ran on every push to main that changed what the app is made of. When the app's work starts
# again, that trigger and the test that held its paths to what the app bundles are in this file's history (#1291,
# apps/mobile/test/preview-paths.test.mjs). apps/mobile/test/expo-by-hand.test.mjs holds this file to a hand's run.
name: Preview
on:
  workflow_dispatch: {}
jobs:
  fingerprint:
    type: fingerprint
    environment: preview
  get_android_build:
    needs: [fingerprint]
    type: get-build
    params:
      platform: android
      profile: preview
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      wait_for_in_progress: true
  build_android:
    needs: [get_android_build]
    if: ${{ !needs.get_android_build.outputs.build_id }}
    type: build
    params:
      platform: android
      profile: preview
  update_android:
    needs: [get_android_build]
    if: ${{ needs.get_android_build.outputs.build_id }}
    type: update
    environment: preview
    params:
      platform: android
      channel: preview
