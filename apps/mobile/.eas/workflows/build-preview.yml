# A preview build of both platforms whenever the shell or the contracts it imports change on main.
# The tag-driven deploy (fingerprint, reuse a build, else build and submit) is PR 6's.
name: Preview build
on:
  push:
    branches: [main]
    paths: ["apps/mobile/**", "packages/contracts/**"]
jobs:
  build_android:
    type: build
    params:
      platform: android
      profile: preview
  build_ios:
    type: build
    params:
      platform: ios
      profile: preview
