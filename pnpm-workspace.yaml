packages:
  - apps/*
  - packages/*
  - tooling/*

# One TypeScript for every compiler and tool: each package.json names it "catalog:".
# tooling/scripts/tests/types/ holds it: typescript-is-declared-once.test.mjs the pin and the names,
# typescript-is-installed-once.test.mjs the install.
catalog:
  typescript: 6.0.3

# `pnpm add` writes "catalog:": it refuses a version outside the catalog, and adds a new dependency to it.
catalogMode: strict
