packages:
  - apps/*
  - packages/*
  - tooling/*
  - tests
  # The video template's toolchain is installed only where a machine image is built (tooling/video/README.md). It is
  # outside the workspace, with a lock of its own, so it names its versions itself.
  - "!tooling/video"

# Every third-party dependency that two workspace projects name, written once: its version is here, and each
# package.json that names it says "catalog:". Until 25 Nov 2026 zod was written ^4.6.7 in six package.json files and
# supabase-js in seven, and Dependabot moved each of those lines on its own.
#
# One pin style, exact, here and in every package.json (decision 0054: "pinned exactly, no caret"). The lockfile
# installs one version of each line anyway, so an exact line says which, and the lockfile's catalog holds that same
# version beside it; a range lets the line and the install differ without either saying so. Dependabot keeps the style
# it finds, and moves an exact line to the next exact version, here and in the lockfile's catalog together. Measured
# 25 Nov 2026: two lines moved (@types/react 19.3.0 to 19.3.2, @types/node 24.19.2 to 24.19.4) and the lockfile written
# again by pnpm 10.34.5, the form Dependabot's own lockfiles keep (#2536), installed --frozen-lockfile; the same lines
# against the old lockfile were refused. An override (below) is a range by nature.
#
# The phone app keeps its own pins, which Expo sets: its react and react-dom are the SDK's (19.2.3, beside the
# dashboard's 19.3), its eslint is the one Expo's lint config takes (eslint-plugin-react 7 and eslint-plugin-import 2
# stop at eslint 9), and its Expo packages are written as `expo install` writes them (~). apps/mobile/package.json
# holds those, and Dependabot leaves them to the SDK (.github/dependabot.yml).
#
# tests/repo/settings/dependencies-declared-once.test.mjs holds all of it; tests/types/ the one TypeScript, its pin
# (typescript-is-declared-once.test.mjs) and its install (typescript-is-installed-once.test.mjs).
catalog:
  "@elevenlabs/client": 1.38.0
  "@supabase/ssr": 0.12.7
  "@supabase/supabase-js": 2.119.2
  "@tanstack/table-core": 9.3.1
  "@types/node": 24.19.2
  "@types/react": 19.3.0
  esbuild: 0.28.2
  lightningcss: 1.33.0
  maplibre-gl: 6.19.0
  next: 16.4.6
  react: 19.3.1
  react-dom: 19.3.1
  sharp: 0.35.5
  stripe: 22.6.2
  typescript: 6.0.3
  zod: 4.6.7

# Manual, pnpm's default: a dependency joins the catalog when a person writes it there. Under `strict`, an update of a
# dependency outside the catalog writes it into the lockfile's catalogs (pnpm 10 and 11 alike, measured 29 Sep 2026),
# which pnpm-workspace.yaml then disagrees with, so every Dependabot update failed CI's --frozen-lockfile.
# dependencies-declared-once.test.mjs holds the names instead.
catalogMode: manual

# Every setting pnpm reads is here, not in package.json's "pnpm" field or .npmrc: pnpm 11 reads neither, Dependabot's
# updater ran pnpm 11 when the lockfile it wrote disagreed with CI's (29 Sep 2026; tests/repo/settings/pnpm-settings.test.mjs),
# and its lockfiles since (#2532, #2536) are in pnpm 10's form.
#
# Vercel's vanilla-function bundler (nft) did not follow pnpm symlinks into the lambda, so third-party deps are hoisted to
# real dirs and workspace packages injected as copies. The edge is bundled by esbuild since 16 Oct 2026 and the packages
# ship as their sources since 28 Oct 2026 (decision 0074), so neither is needed now; each is its own change, since both
# rewrite the lockfile.
nodeLinker: hoisted
injectWorkspacePackages: true

# A transitive version with an advisory, lifted to the first fixed one. pnpm rewrites every range that admits a version
# below it, so a line stays until nothing that brings the package asks for one (each re-read 25 Nov 2026, and again 26
# Nov against the ranges its dependents publish: all eight still needed). uuid and decode-uri-component come with the
# phone app (Expo's config plugins, expo-router's query-string); decode-uri-component 0.5 is ESM only, so
# patches/query-string@7.1.3.patch reads its default export (tests/mobile/overridden-packages.test.mjs), and 0.5.1
# decodes a run of percent-escapes in one pass
# (GHSA-qr28-fpjm-wq7f, 29 Oct 2026: 0.5.0's was quadratic). node-forge comes with the Expo CLI (^1.3.3;
# GHSA-7wch-p9px-956x and four more, 31 Oct 2026), postcss with Expo's Metro config (^8.5.14; GHSA-fxqj-rqcc-2cmp), and
# source-map-js with postcss (^1.2.1; GHSA-68fv-2mgg-jv7q, 6 Oct 2026). esbuild comes with tsx (~0.28.0;
# GHSA-g7r4-m6w7-qqqr, a file read through the dev server on Windows). shell-quote comes with the phone app's
# react-native, through react-devtools-core (GHSA-pqg4-j6r4-53mv, critical, 6 Oct 2026; 1.11 is the same 1.x). zod 4
# comes with @vercel/sandbox's OIDC, whose config pins 4.1.11 (GHSA-mrhx-c7xc-m3w5, 25 Nov 2026): lifted within zod 4,
# so the Expo CLI's zod 3 is left alone. sharp's line left on 25 Nov 2026: Next asks ^0.35.5 itself.
overrides:
  decode-uri-component@<0.5.1: ^0.5.1
  esbuild@<0.28.1: ^0.28.2
  node-forge@<1.4.1: ^1.4.1
  postcss@<8.5.23: ^8.5.28
  shell-quote@<1.11.0: ^1.11.0
  source-map-js@<1.2.2: ^1.2.2
  uuid@<11.1.1: ^11.1.1
  zod@>=4.0.0 <4.6.6: ^4.6.7
# pnpm 11.25 writes this block into the lockfile as a bare hash, which pnpm 10.34.5 refuses at --frozen-lockfile
# (measured 25 Nov 2026, with no other change), so the two pnpms cannot share a lockfile while a patch is here: a move to
# pnpm 11 moves the lockfile and CI together. The form changed by design in pnpm 11.0.0 ("Simplified patchedDependencies
# lockfile format"), and no pnpm 10 since reads it (10.34.9 the newest, 26 Nov 2026). The patch is the phone app's: its
# expo-router 57 (the SDK 57 it is paused on) asks query-string ^7.1.3, 7.1.3 is the last 7.x and requires
# decode-uri-component, and the only release fixed for GHSA-qr28-fpjm-wq7f (0.5.1) is ESM only. expo-router 58 asks no
# query-string, so the patch, its override and its test go with the phone app's move to SDK 58. A wrapper of our own in
# its place would change the phone's bundle, which only a phone build can prove. The patch blocks a mix, not the move:
# CI (pnpm/action-setup) and both Vercel builds take their pnpm from package.json's packageManager (the dashboard's build
# log, 26 Nov 2026: "generated by pnpm@10.x from package.json#packageManager pnpm@10.34.5"), so a move to pnpm 11 is one
# change of its own, the line and the lockfile written by 11 together, proved by CI's frozen install and both previews.
patchedDependencies:
  query-string@7.1.3: patches/query-string@7.1.3.patch

# An advisory with no patched version anywhere is ignored here by its GHSA, so CI's `pnpm audit --prod --audit-level
# high` (ci.yml, "Audit, licences and format") still fails on every other one. Each is named in ci.yml's note beside that
# step, with the day and why; drop it once a fix ships (tests/repo/settings/pnpm-settings.test.mjs holds the two
# together). Re-read 26 Nov 2026: GHSA-mrhx-c7xc-m3w5's range is every zod below 4.6.6, with no 3.x fixed, and the
# Expo CLI asks zod ^3.25.76, so it stays until the phone app's next SDK.
auditConfig:
  ignoreGhsas:
    - GHSA-mrhx-c7xc-m3w5
